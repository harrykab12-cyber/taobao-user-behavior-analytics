table_name: fct_daily_metrics
main_dttm_col: event_date
description: 日粒度行为指标；PV 仅统计 behavior_type='pv' 的事件。
schema: "__DBT_SCHEMA__"
uuid: 11111111-1111-4111-8111-111111111201
database_uuid: 11111111-1111-4111-8111-111111111111
