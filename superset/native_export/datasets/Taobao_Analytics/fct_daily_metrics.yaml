  - {column_name: cart_users, type: BIGINT, groupby: false, filterable: false}
  - {column_name: purchase_users, type: BIGINT, groupby: false, filterable: false}
  - {column_name: new_users, type: BIGINT, groupby: false, filterable: false}
  - {column_name: repeat_purchase_users, type: BIGINT, groupby: false, filterable: false}
