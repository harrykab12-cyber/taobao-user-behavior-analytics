table_name: fct_user_segment_activity
main_dttm_col: event_date
description: 用户-日期-类目粒度的分层活动，用于日期、类目、分层联动筛选。
schema: "__DBT_SCHEMA__"
uuid: 11111111-1111-4111-8111-111111111207
database_uuid: 11111111-1111-4111-8111-111111111111
version: 1.0.0
columns:
  - {column_name: user_id, type: BIGINT, groupby: true, filterable: true}
  - {column_name: event_date, type: DATE, is_dttm: true, groupby: true, filterable: true}
  - {column_name: category_id, type: BIGINT, groupby: true, filterable: true}
  - {column_name: user_segment, type: TEXT, groupby: true, filterable: true}
  - {column_name: has_pv, type: INTEGER, groupby: true, filterable: true}
  - {column_name: has_favorite, type: INTEGER, groupby: true, filterable: true}
  - {column_name: has_cart, type: INTEGER, groupby: true, filterable: true}
  - {column_name: has_purchase, type: INTEGER, groupby: true, filterable: true}
metrics:
  - {metric_name: count_distinct_segment_users, verbose_name: 用户数, expression: 'COUNT(DISTINCT user_id)'}
  - metric_name: count_distinct_cart_without_buy_users
    verbose_name: 加购未购用户数
    expression: "COUNT(DISTINCT CASE WHEN user_segment = '加购未购型' THEN user_id END)"
  - metric_name: count_distinct_category_purchase_users
    verbose_name: 类目购买用户数
    expression: 'COUNT(DISTINCT CASE WHEN has_purchase = 1 THEN user_id END)'
